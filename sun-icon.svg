<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
  </defs>
  <!-- Sun rays -->
  <g fill="#FFD700">
    <rect x="47" y="5" width="6" height="15" rx="3"/>
    <rect x="47" y="80" width="6" height="15" rx="3"/>
    <rect x="5" y="47" width="15" height="6" rx="3"/>
    <rect x="80" y="47" width="15" height="6" rx="3"/>
    <rect x="17" y="17" width="6" height="15" rx="3" transform="rotate(45 20 24.5)"/>
    <rect x="77" y="17" width="6" height="15" rx="3" transform="rotate(-45 80 24.5)"/>
    <rect x="17" y="68" width="6" height="15" rx="3" transform="rotate(-45 20 75.5)"/>
    <rect x="77" y="68" width="6" height="15" rx="3" transform="rotate(45 80 75.5)"/>
  </g>
  <!-- Sun circle -->
  <circle cx="50" cy="50" r="28" fill="url(#sun)"/>
</svg>
